<!DOCTYPE html>
<html lang="bn" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAHIN- Admission Tools</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        /* Import Baloo Da 2 Font */
        @import url('https://fonts.maateen.me/solaiman-lipi/font.css');

        /* Custom Styles for Modern UI */
        :root {
            /* Global Variables */
            --primary-color: #0d6efd;
            --header-bg-light: linear-gradient(135deg, #e0f7fa, #ffffff);
            --card-shadow: 0 6px 15px rgba(0, 0, 0, 0.08);
            --card-hover-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
        }

        [data-bs-theme="dark"] {
            /* Dark Mode Variables */
            --header-bg-dark: linear-gradient(135deg, #1f2b3a, #0d1a26);
            --card-shadow: 0 6px 15px rgba(0, 0, 0, 0.4);
            --card-hover-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
        }

        body {
            /* Apply Baloo Da 2 font */
            font-family: 'SolaimanLipi', sans-serif;
            transition: background-color 0.3s, color 0.3s;
        } 

        /* --- Attractive Header Design --- */
        .attractive-header {
            padding: 80px 0;
            margin-bottom: 40px;
            text-align: center;
            /* Light Mode Background */
            background: var(--header-bg-light);
            transition: background 0.5s;
        }
        [data-bs-theme="dark"] .attractive-header {
            /* Dark Mode Background */
            background: var(--header-bg-dark);
            color: #f8f9fa; 
        }
        
        .header-title {
            font-size: 3.5rem;
            font-weight: 800;
            color: var(--primary-color);
            margin-bottom: 0.5rem;
        }

        /* --- Tool Card Design --- */
        .tool-card {
            border: 1px solid rgba(0, 0, 0, 0.1);
            border-radius: 16px;
            box-shadow: var(--card-shadow);
            transition: transform 0.3s, box-shadow 0.3s, border-color 0.3s;
            height: 100%; 
            overflow: hidden;
        }
        [data-bs-theme="dark"] .tool-card {
            border-color: rgba(255, 255, 255, 0.1);
        }

        .tool-card:hover {
            transform: translateY(-8px); 
            box-shadow: var(--card-hover-shadow);
        }

        .card-icon {
            font-size: 2.5rem;
            margin-bottom: 15px;
            color: var(--primary-color);
        }
        
        /* Navbar Styling */
        .navbar {
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        }
        [data-bs-theme="dark"] .navbar {
            border-bottom-color: rgba(255, 255, 255, 0.05);
        }

    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg sticky-top bg-body-tertiary">
        <div class="container">
            <a class="navbar-brand fw-bold text-primary" href="#">
                <i class="bi bi-rocket-takeoff-fill me-2"></i> মাহিন— অ্যাডমিশন টুলস
            </a>
            
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <button class="btn btn-outline-secondary rounded-pill" id="theme-toggle" title="দিন/রাত মোড পরিবর্তন করুন">
                        <i class="bi bi-moon-fill me-1" id="theme-icon"></i> <span class="d-none d-sm-inline">থিম</span>
                    </button>
                </li>
            </ul>
        </div>
    </nav>

    <header class="attractive-header">
        <div class="container">
            <h1 class="header-title"> অ্যাডমিশনের যাদুকরী টুলস </h1>
            <p class="lead text-muted">
                বাংলাদেশের অ্যাডমিশনে বহুল ব্যবহৃত টুলস যা সাহায্য করবে যেকোনো মুহুর্তে 
            </p>
            <i class="bi bi-tools" style="font-size: 3rem; margin-top: 15px;"></i>
        </div>
    </header>

    <div class="container my-5">
        <h2 class="text-center mb-4 fw-bold">আমাদের প্রয়োজনীয় টুলগুলো এক্সপ্লোর করুন</h2>
        <p class="text-center mb-5 text-muted">রিসোর্সটি দেখতে যেকোনো টুল কার্ডে ক্লিক করুন।</p>

        <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4" id="tools-grid">
            </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

    <script>
        // 1. Tool Data (Translated to Bangla)
        const toolsData = [
            {
                title: "অ্যাডমিশন ক্যালেন্ডার",
                description: "ভর্তি পরীক্ষায় প্রত্যেকটি বিশ্ববিদ্যালয়ের আবেদন, পরীক্ষা সময়সূচি, খুঁটিনাটি তথ্যের পূর্ণাঙ্গ ক্যালেন্ডার ",
                link: "https://admc.maahin.my.id/",
                icon: "bi-calendar-heart"
            },
            {
                title: "ফটো রিসাইজার",
                description: "৩০০×৩০০ পিক্সেলের ছবি রিসাইজ করে কনভার্ট করুন ১ ক্লিকের মাধ্যমে",
                link: "http://imgresize.maahin.my.id",
                icon: "bi-image"
            },
            {
                title: "স্বাক্ষর রিসাইজার",
                description: "৩০০×৮০ পিক্সেলের স্বাক্ষর রিসাইজ করে কনভার্ট করুন ১ ক্লিকে।",
                link: "https://imgresize.maahin.my.id/sign",
                icon: "bi-vector-pen"
            },
            {
                title: "এগ্রি জিপিএ মার্ক ক্যালকুলেটর",
                description: "কৃষি গুচ্ছে ৫০ এর মধ্যে তোমার মার্ক কত হবে তা দেখতে এই ক্যালকুলেটর ব্যবহার করো।",
                link: "https://agri-calc.maahin.my.id/",
                icon: "bi-calculator"
            },
            {
                title: "এগ্রি এলিজিবিলিটি চেকার",
                description: "আপনার জিপিএ ইনপুট দিয়ে চেক করুন আপনি ভর্তি পরীক্ষায় বসার যোগ্য কিনা",
                link: "https://agri-calc.maahin.my.id/gpa",
                icon: "bi-clipboard-check"
            },
            {
                title: "CSS জেনারেটর",
                description: "শ্যাডো, গ্রেডিয়েন্ট, এবং ক্লিপ-এর মতো জটিল CSS প্রপার্টির জন্য ভিজ্যুয়াল টুল।",
                link: "https://cssmatic.com/",
                icon: "bi-filetype-css"
            }
        ];

        // 2. JavaScript for Rendering Tools
        const toolsGrid = document.getElementById('tools-grid');

        toolsData.forEach(tool => {
            const toolCardHTML = `
                <div class="col">
                    <div class="card tool-card p-4">
                        <div class="card-body">
                            <i class="card-icon ${tool.icon}"></i>
                            <h5 class="card-title fw-bold">${tool.title}</h5>
                            <p class="card-text text-muted">${tool.description}</p>
                            <a href="${tool.link}" class="btn btn-primary btn-sm mt-3" target="_blank">
                                ভিজিট করুন <i class="bi bi-arrow-right-short"></i>
                            </a>
                        </div>
                    </div>
                </div>
            `;
            toolsGrid.insertAdjacentHTML('beforeend', toolCardHTML);
        });


        // 3. JavaScript for Day/Night Mode Toggle (Text updated to Bangla)
        const themeToggleBtn = document.getElementById('theme-toggle');
        const themeIcon = document.getElementById('theme-icon');
        const htmlElement = document.documentElement;

        // Function to set the theme
        function setTheme(theme) {
            htmlElement.setAttribute('data-bs-theme', theme);
            // Update the icon
            if (theme === 'dark') {
                themeIcon.classList.remove('bi-moon-fill');
                themeIcon.classList.add('bi-sun-fill');
            } else {
                themeIcon.classList.remove('bi-sun-fill');
                themeIcon.classList.add('bi-moon-fill');
            }
            // Save preference to localStorage
            localStorage.setItem('theme', theme);
        }

        // Check for saved preference or system preference on load
        function loadTheme() {
            const savedTheme = localStorage.getItem('theme');
            const systemPrefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            
            let initialTheme = 'light';
            if (savedTheme) {
                initialTheme = savedTheme;
            } else if (systemPrefersDark) {
                initialTheme = 'dark';
            }
            
            setTheme(initialTheme);
        }
        
        // Event listener for the toggle button
        themeToggleBtn.addEventListener('click', () => {
            const currentTheme = htmlElement.getAttribute('data-bs-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            setTheme(newTheme);
        });

        // Initialize the theme when the page loads
        document.addEventListener('DOMContentLoaded', loadTheme);

    </script>
</body>
</html>
